syntax = "proto3";

package products.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 stock_quantity = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 stock_quantity = 4;
}

message CreateProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  common.v1.PageRequest pagination = 1;
}

message ListProductsResponse {
  repeated Product products = 1;
  common.v1.PageResponse pagination = 2;
}

message CheckAndReserveStockRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckAndReserveStockResponse {
  bool success = 1;
  string message = 2;
  int32 remaining_stock = 3;
}

service ProductService {
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc CheckAndReserveStock (CheckAndReserveStockRequest) returns (CheckAndReserveStockResponse);
}
