syntax = "proto3";

package users.v1;

import "common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// User status — demonstrates enum usage with a domain-specific meaning.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
}

// A user entity.
message User {
  string id = 1;
  string name = 2;
  string email = 3;
  UserStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// --- Unary RPCs ---

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
}

message CreateUserResponse {
  User user = 1;
}

// --- List with pagination ---

message ListUsersRequest {
  common.v1.PageRequest pagination = 1;
}

message ListUsersResponse {
  repeated User users = 1;
  common.v1.PageResponse pagination = 2;
}

// The User service demonstrates Unary RPCs with real-world patterns:
// input validation, error handling, pagination.
service UserService {
  // Get a single user by ID.
  rpc GetUser (GetUserRequest) returns (GetUserResponse);

  // Create a new user. Returns ALREADY_EXISTS if email is taken.
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);

  // List users with pagination.
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
}
