syntax = "proto3";

package helloworld;

// The greeting service — the simplest possible gRPC service.
// One method, one request, one response.
service Greeter {
  // Sends a greeting. This is a unary RPC: one request in, one response out.
  rpc SayHello (HelloRequest) returns (HelloReply);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greeting.
message HelloReply {
  string message = 1;
}
